<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="A survey game board: two teams, eight hidden answer rows, three strikes">
  <title>The Survey Showdown board</title>
  <rect width="800" height="800" fill="#0E1726"/>

  <!-- survey count -->
  <rect x="300" y="44" width="200" height="54" rx="4" fill="#182236" stroke="#2A3548" stroke-width="2"/>
  <text x="400" y="80" fill="#14BABD" font-family="Poppins,system-ui,sans-serif" font-size="30" font-weight="700" text-anchor="middle">100</text>

  <!-- team scores -->
  <rect x="40" y="44" width="200" height="54" rx="4" fill="#182236" stroke="#EC579D" stroke-width="2"/>
  <text x="140" y="80" fill="#EC579D" font-family="Poppins,system-ui,sans-serif" font-size="30" font-weight="700" text-anchor="middle">62</text>
  <rect x="560" y="44" width="200" height="54" rx="4" fill="#182236" stroke="#14BABD" stroke-width="2"/>
  <text x="660" y="80" fill="#14BABD" font-family="Poppins,system-ui,sans-serif" font-size="30" font-weight="700" text-anchor="middle">38</text>

  <!-- the board -->
  <rect x="40" y="128" width="720" height="532" rx="8" fill="#111C2E" stroke="#2A3548" stroke-width="2"/>

  <!-- revealed rows -->
  <g font-family="Poppins,system-ui,sans-serif">
    <rect x="72" y="160" width="656" height="56" rx="4" fill="#1D2B42" stroke="#2A3548"/>
    <text x="96" y="196" fill="#FFFFFF" font-size="22" font-weight="600">THE DANCE FLOOR</text>
    <rect x="640" y="160" width="88" height="56" rx="4" fill="#14BABD"/>
    <text x="684" y="197" fill="#0E1726" font-size="24" font-weight="700" text-anchor="middle">34</text>

    <rect x="72" y="226" width="656" height="56" rx="4" fill="#1D2B42" stroke="#2A3548"/>
    <text x="96" y="262" fill="#FFFFFF" font-size="22" font-weight="600">THE OPEN BAR</text>
    <rect x="640" y="226" width="88" height="56" rx="4" fill="#14BABD"/>
    <text x="684" y="263" fill="#0E1726" font-size="24" font-weight="700" text-anchor="middle">21</text>

    <rect x="72" y="292" width="656" height="56" rx="4" fill="#1D2B42" stroke="#2A3548"/>
    <text x="96" y="328" fill="#FFFFFF" font-size="22" font-weight="600">THE CAKE</text>
    <rect x="640" y="292" width="88" height="56" rx="4" fill="#14BABD"/>
    <text x="684" y="329" fill="#0E1726" font-size="24" font-weight="700" text-anchor="middle">17</text>
  </g>

  <!-- hidden rows -->
  <g font-family="Poppins,system-ui,sans-serif">
    <rect x="72" y="358" width="656" height="56" rx="4" fill="#182236" stroke="#2A3548"/>
    <text x="400" y="396" fill="#3E5570" font-size="26" font-weight="700" text-anchor="middle">4</text>
    <rect x="72" y="424" width="656" height="56" rx="4" fill="#182236" stroke="#2A3548"/>
    <text x="400" y="462" fill="#3E5570" font-size="26" font-weight="700" text-anchor="middle">5</text>
    <rect x="72" y="490" width="656" height="56" rx="4" fill="#182236" stroke="#2A3548"/>
    <text x="400" y="528" fill="#3E5570" font-size="26" font-weight="700" text-anchor="middle">6</text>
    <rect x="72" y="556" width="656" height="56" rx="4" fill="#182236" stroke="#2A3548"/>
    <text x="400" y="594" fill="#3E5570" font-size="26" font-weight="700" text-anchor="middle">7</text>
  </g>

  <!-- strikes -->
  <g stroke="#EC579D" stroke-width="7" stroke-linecap="round">
    <path d="M292 700 L336 744 M336 700 L292 744"/>
    <path d="M378 700 L422 744 M422 700 L378 744"/>
  </g>
  <rect x="454" y="694" width="56" height="56" rx="4" fill="none" stroke="#2A3548" stroke-width="3"/>
</svg>
